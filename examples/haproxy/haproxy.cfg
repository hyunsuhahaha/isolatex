# HAProxy 2.8+. Set the three environment variables before validation/start.
global
    maxconn 2048

defaults
    mode http
    timeout connect 1s
    timeout client 15s
    timeout server 15s
    timeout check 1s
    timeout queue 100ms
    retries 0
    default-server inter 500ms fall 2 rise 2

frontend public
    bind "${ISOLATEX_LB_BIND}"
    acl alpha_path path /a
    acl alpha_path path_beg /a/
    acl beta_path path /b
    acl beta_path path_beg /b/
    # Probe requests go directly to the private node addresses, never clients.
    http-request deny deny_status 404 unless alpha_path or beta_path
    use_backend alpha if alpha_path
    use_backend beta if beta_path

backend alpha
    balance roundrobin
    option httpchk
    http-check send meth GET uri /_isolatex/route/alpha ver HTTP/1.1 hdr Host isolatex-probe
    http-check expect status 200
    server node_a "${ISOLATEX_NODE_A}" check
    server node_b "${ISOLATEX_NODE_B}" check

backend beta
    balance roundrobin
    option httpchk
    http-check send meth GET uri /_isolatex/route/beta ver HTTP/1.1 hdr Host isolatex-probe
    http-check expect status 200
    server node_a "${ISOLATEX_NODE_A}" check
    server node_b "${ISOLATEX_NODE_B}" check
