name: test
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: stable
          - os: windows-latest
            go: stable
          - os: ubuntu-24.04-arm
            go: stable
          - os: macos-latest
            go: stable
          - os: macos-15-intel
            go: stable
          - os: ubuntu-latest
            go: '1.25.x'
          - os: windows-latest
            go: '1.25.x'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - run: go mod verify
      - name: Check known module and reachable symbol vulnerabilities
        if: matrix.go == 'stable'
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -C cmd/isolatex -scan module
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go test ./... -count=1 -timeout=90s
      - run: go vet ./...
      - name: Check group-scoped monitoring rules
        if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        run: |
          mkdir -p .tools/prometheus
          curl -fsSL --retry 3 -o .tools/prometheus/prometheus.tar.gz https://github.com/prometheus/prometheus/releases/download/v3.15.1/prometheus-3.15.1.linux-amd64.tar.gz
          echo '6a726885328ad9efebbf36e876ce2fb6225468a71fd1e7ce3ba666d5f4d97a84  .tools/prometheus/prometheus.tar.gz' | sha256sum -c -
          tar -xzf .tools/prometheus/prometheus.tar.gz -C .tools/prometheus --strip-components=1 prometheus-3.15.1.linux-amd64/promtool
          bash scripts/check-observability.sh .tools/prometheus/promtool
      - if: runner.os == 'Linux'
        run: go test -race ./... -count=1 -timeout=90s
      - name: Verify independent group routing through real HAProxy
        if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y haproxy
          ISOLATEX_TEST_HAPROXY="$(command -v haproxy)" go test -race ./internal/gateway -run '^TestHAProxyIndependentGroupRouting$' -count=2 -timeout=90s
      - name: Verify delegated cgroup memory and task enforcement
        if: runner.os == 'Linux'
        run: sudo bash scripts/check-memory-linux.sh "$(id -un)" "$(command -v go)"
      - name: Verify delegated worker-tree CPU enforcement
        if: runner.os == 'Linux'
        run: sudo bash scripts/check-cpu-linux.sh "$(id -un)" "$(command -v go)"
      - if: runner.os == 'Linux' && matrix.go == 'stable'
        run: bash scripts/smoke.sh
      - name: Exercise matched-resource experiment topologies
        if: runner.os == 'Linux' && matrix.go == 'stable'
        run: |
          go run ./bench/compare -warmup 0 -baseline 1s -fault 2s -recovery 1s -repeats 1 -healthy-rate 10 -fault-rate 10 -scenario delay -out bin/compare-delay.json
          go run ./bench/compare -warmup 0 -baseline 1s -fault 2s -recovery 1s -repeats 1 -healthy-rate 10 -fault-rate 10 -scenario crash -out bin/compare-crash.json
      - name: Verify distribution script and native archive
        if: runner.os != 'Windows' && matrix.go == 'stable'
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          TARGETS="$(go env GOOS)/$(go env GOARCH)" bash scripts/build-dist.sh ci
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum -c SHA256SUMS)
          else
            (cd dist && shasum -a 256 -c SHA256SUMS)
          fi
          mkdir -p .tools/dist-check
          tar -xzf "dist/isolatex_ci_$(go env GOOS)_$(go env GOARCH).tar.gz" -C .tools/dist-check
          (cd .tools/dist-check && bin/isolatex -version && bin/isolatex -config isolatex.yaml -check)
          bash scripts/smoke-dist.sh .tools/dist-check
