name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            go: stable
          - os: windows-latest
            go: stable
          - os: ubuntu-latest
            go: '1.23.x'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go test ./... -count=1 -timeout=90s
      - run: go vet ./...
      - if: runner.os == 'Linux'
        run: go test -race ./... -count=1 -timeout=90s
      - if: runner.os == 'Linux' && matrix.go == 'stable'
        run: bash scripts/smoke.sh
