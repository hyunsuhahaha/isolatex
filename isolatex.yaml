version: 1
listen: "127.0.0.1:8080"
admin_listen: "127.0.0.1:9090"
# Reserved capacity: alpha (8 + 8) + beta (2 + 4).
max_admitted_requests: 22
# Public accepted TCP connections, including pre-header and idle sockets.
max_connections: 1024
max_body_bytes: 1048576
shutdown_grace: 5s
bulkheads:
  alpha:
    match:
      path_prefix: /a
    process:
      command: ["./bin/demo-app"]
      workers: 2
      port_start: 9100
      env:
        APP_POOL: alpha
    max_concurrent: 8
    queue_size: 8
    queue_timeout: 200ms
    request_timeout: 2s
    readiness:
      path: /readyz
      interval: 100ms
      timeout: 300ms
      startup_timeout: 10s
  beta:
    match:
      path_prefix: /b
    process:
      command: ["./bin/demo-app"]
      workers: 2
      port_start: 9200
      env:
        APP_POOL: beta
    max_concurrent: 2
    queue_size: 4
    queue_timeout: 200ms
    request_timeout: 5s
    readiness:
      path: /readyz
      interval: 100ms
      timeout: 300ms
      startup_timeout: 10s
